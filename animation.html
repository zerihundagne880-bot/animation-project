<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern CSS Animation Project</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: #2c3e50;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .box {
      width: 120px;
      height: 120px;
      margin: 15px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    /* Box 1 - Color & Pulse */
    .color-box {
      background-color: #ff4757;
      animation: colorPulse 4s infinite;
    }

    @keyframes colorPulse {
      0% { background-color: #ff4757; transform: scale(1); }
      50% { background-color: #2e86de; transform: scale(1.1); }
      100% { background-color: #ff4757; transform: scale(1); }
    }

    /* Box 2 - Float Move */
    .move-box {
      background-color: #ffa502;
      animation: floatMove 3s ease-in-out infinite alternate;
    }

    @keyframes floatMove {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-50px) rotate(10deg); }
    }

    /* Box 3 - Smooth Spin */
    .rotate-box {
      background-color: #8e44ad;
      animation: smoothSpin 6s linear infinite;
    }

    @keyframes smoothSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Hover Effects */
    .box:hover {
      filter: brightness(1.2);
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ CSS Magic Shapes</h1>
    <div class="box color-box"></div>
    <div class="box move-box"></div>
    <div class="box rotate-box"></div>
  </div>
</body>
</html>
