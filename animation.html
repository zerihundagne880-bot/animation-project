<!DOCTYPE html>
<html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Project</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }.container {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Box 1 - Color Animation */
.color-box {
  width: 150px;
  height: 150px;
  background-color: red;
  margin: 20px;
  border-radius: 15px;
  animation: colorChange 4s infinite;
}

@keyframes colorChange {
  0% { background-color: red; }
  33% { background-color: blue; }
  66% { background-color: green; }
  100% { background-color: red; }
}

/* Box 2 - Move Animation */
.move-box {
  width: 150px;
  height: 150px;
  background-color: orange;
  margin: 20px;
  border-radius: 15px;
  animation: moveBox 3s infinite alternate;
}

@keyframes moveBox {
  0% { transform: translateX(0); }
  100% { transform: translateX(200px); }
}

/* Box 3 - Rotate Animation */
.rotate-box {
  width: 150px;
  height: 150px;
  background-color: purple;
  margin: 20px;
  border-radius: 15px;
  animation: rotateBox 5s linear infinite;
}

@keyframes rotateBox {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

h1 {
  text-align: center;
  color: #333;
  margin-bottom: 40px;
}

  </style>
</head>
<body>
  <div class="container">
    <h1>CSS Animation Project</h1>
    <div class="color-box"></div>
    <div class="move-box"></div>
    <div class="rotate-box"></div>
  </div>
</body>
</html>
